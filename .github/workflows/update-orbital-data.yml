name: Refresh orbital and spacecraft catalogs

on:
  schedule:
    - cron: '17 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbital-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Fetch valid CelesTrak and NASA/JPL snapshots
        run: npm run data:update
      - name: Validate
        run: npm run validate
      - name: Commit only when data changed
        run: |
          if git diff --quiet -- public/data; then
            echo "Orbital catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/active.json public/data/debris-*.json public/data/metadata.json public/data/spacecraft.json
          git commit -m "data: refresh orbital and JPL ephemerides"
          git push origin main
